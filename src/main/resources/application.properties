spring.application.name=military

# Actuator: solo se expone health; el resto de endpoints quedan cerrados.
management.endpoints.web.exposure.include=health

# Habilita las probes de liveness y readiness fuera de Kubernetes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Grupos explicitos, para que quede documentado que comprueba cada probe.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
